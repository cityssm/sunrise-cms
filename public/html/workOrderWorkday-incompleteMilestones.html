<div class="modal" role="dialog" aria-label="Incomplete Milestones">
  <div class="modal-background"></div>
  <div class="modal-card">
    <div class="modal-card-head">
      <h3 class="modal-card-title">Incomplete Milestones on Previous Days</h3>
      <button
        class="delete is-close-modal-button"
        type="button"
        aria-label="close"
      ></button>
    </div>
    <section class="modal-card-body">
      <div class="menu">
        <ul class="menu-list" id="list--incompleteMilestoneDays"></ul>
      </div>
    </section>
    <div class="modal-card-foot is-justify-content-right">
      <button class="button is-close-modal-button" type="button">
        Close
      </button>
    </div>
  </div>
</div>
